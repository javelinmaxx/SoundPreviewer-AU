name: Desktop build and packages

on:
  push:
    branches: ['**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  user-guide:
    name: Compile CHM user guide
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compile Markdown chapters and verify CHM contents
        shell: pwsh
        run: ./scripts/Build-UserGuide.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compiled-user-guide
          path: artifacts/user-guide/SoundPreviewer.chm
          if-no-files-found: error
          retention-days: 14
  desktop:
    needs: user-guide
    name: ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: macos-15
            runtime: osx-arm64
          - os: macos-15-intel
            runtime: osx-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: compiled-user-guide
          path: artifacts/user-guide
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate approved major version
        shell: bash
        run: |
          python - <<'PY'
          import json, re, xml.etree.ElementTree as ET
          version = ET.parse('Version.props').findtext('./PropertyGroup/Version')
          if not version or not re.fullmatch(r'\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?', version):
              raise SystemExit('Version.props must contain a semantic version.')
          approved_major = json.load(open('version-policy.json', encoding='utf-8'))['approvedMajor']
          if int(version.split('.')[0]) != approved_major:
              raise SystemExit('Major-version changes require explicit user confirmation and an approvedMajor policy update.')
          PY
      - name: Restore and build
        run: |
          dotnet restore SoundPreviewer.sln --configfile NuGet.Config
          dotnet build SoundPreviewer.sln -c Release --no-restore
      - name: Verify installation-local legacy cache migration
        run: dotnet run --project tests/SoundPreviewer.Tests -c Release --no-build -- --filter Installation-local
      - name: Verify library and workers
        run: dotnet run --project tests/SoundPreviewer.Tests -c Release --no-build
      - name: Install state conversion test dependencies
        run: python -m pip install serum2-preset-loader==0.1.3 cbor2==5.6.5 zstandard==0.23.0
      - name: Verify optional renderer protocol
        run: python -m unittest discover -s scripts/renderers -p "test_*.py"
      - name: Verify macOS source launcher
        if: runner.os == 'macOS'
        run: python -m unittest discover -s tests/scripts -p "test_*.py"
      - name: Publish Windows application and x86 host twice
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/Publish-Desktop.ps1
          ./scripts/Publish-Desktop.ps1
      - name: Verify bundled x86 host without loading plugins
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./src/SoundPreviewer.Vst2Host/verify-self-test.ps1 -HostPath artifacts/publish-win-x64/Vst2Host-x86/SoundPreviewer.Vst2Host.exe
      - name: Publish macOS application twice
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash scripts/Publish-Desktop.sh "${{ matrix.runtime }}"
          bash scripts/Publish-Desktop.sh "${{ matrix.runtime }}"
      - name: Verify published desktop UI with isolated empty user data
        shell: pwsh
        run: ./scripts/Test-DesktopPackage.ps1 -Runtime '${{ matrix.runtime }}'
      - name: Verify Windows private renderer setup and portable relocation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Test-PrivateRenderer.ps1 -ApplicationDirectory artifacts/publish-win-x64
      - name: Verify macOS private renderer setup and portable relocation
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/Test-PrivateRenderer.sh '${{ matrix.runtime }}'
      - name: Verify installed Preview storage and legacy cache migration
        shell: pwsh
        run: ./scripts/Test-InstalledStorage.ps1 -Runtime '${{ matrix.runtime }}'
      - name: Verify startup with missing Preview and Config
        shell: pwsh
        run: ./scripts/Test-FreshStartup.ps1 -Runtime '${{ matrix.runtime }}'
      - name: Prepare Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolDirectory = Join-Path $PWD 'artifacts/packaging-tools'
          $compilerDirectory = Join-Path $toolDirectory 'inno6'
          New-Item -ItemType Directory -Path $toolDirectory -Force | Out-Null
          $installer = Join-Path $toolDirectory 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(^|, )CN=Pyrsys B\.V\.(,|$)') {
            throw 'The compiler download does not have the expected valid publisher signature.'
          }
          $arguments = @('/CURRENTUSER', '/PORTABLE=1', '/LANG=English', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NOICONS', '/TASKS=""', '/NORESTART', ('/DIR="' + $compilerDirectory + '"'))
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Portable compiler preparation failed.' }
      - name: Package Windows installer and portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Package-Desktop.ps1 -InnoSetupCompiler artifacts/packaging-tools/inno6/ISCC.exe
      - name: Verify Windows install, overwrite upgrade and uninstall preserve data
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Test-WindowsInstaller.ps1
      - name: Package macOS app, ZIP and disk image
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/Package-Desktop.sh "${{ matrix.runtime }}"
      - name: Verify packaged macOS app
        if: runner.os == 'macOS'
        shell: pwsh
        run: ./scripts/Test-DesktopPackage.ps1 -Runtime '${{ matrix.runtime }}' -ApplicationPath 'artifacts/package-${{ matrix.runtime }}/SoundPreviewer.app/Contents/MacOS/SoundPreviewer'
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-${{ matrix.runtime }}
          path: artifacts/releases/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload UI diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-diagnostics-${{ matrix.runtime }}
          path: |
            artifacts/ui-smoke-*/
            artifacts/installer-smoke-*/
            artifacts/installed-storage-smoke-*/**/Preview/ui-*
            artifacts/installed-storage-smoke-*/result.json
            artifacts/fresh-startup-smoke-*/result.json
            artifacts/fresh-startup-smoke-*/failure.json
            artifacts/fresh-startup-smoke-*/preserved-data-hashes.json
            artifacts/fresh-startup-smoke-*/*-ui-smoke.json
            artifacts/fresh-startup-smoke-*/*-stdout.txt
            artifacts/fresh-startup-smoke-*/*-stderr.txt
            artifacts/fresh-startup-smoke-*/application/Preview/ui-*
            artifacts/private-renderer-smoke-*/private-renderer-smoke.json
            artifacts/private-renderer-win-x64-*/report.json
            artifacts/dmg-*-attempt-*.txt
          if-no-files-found: ignore
          retention-days: 7
